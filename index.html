<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Absensi</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    :root { --bg: #f8fafc; --main: #0ea5e9; --main-hover: #0284c7; --card: #ffffff; --text: #334155; --text-light: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); display: flex; justify-content: center; color: var(--text); }
    .app-container { width: 100%; max-width: 500px; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: 20px; }
    .hidden { display: none !important; }
    .card { background: var(--card); border-radius: 16px; padding: 24px; margin: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); border: 1px solid var(--border); }
    .form-control { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; font-size: 15px; outline: none; transition: border 0.2s; }
    .form-control:focus { border-color: var(--main); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; margin-bottom: 12px; transition: all 0.2s; }
    .btn-main { background: var(--main); color: #fff; }
    .btn-main:hover { background: var(--main-hover); }
    .btn-green { background: #10b981; color: #fff; }
    .btn-green:hover { background: #059669; }
    .btn-orange { background: #f59e0b; color: #fff; }
    .btn-red { background: #ef4444; color: #fff; }
    .btn-out { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .map-box { height: 250px; width: 100%; border-radius: 10px; margin-bottom: 12px; z-index: 1; }
    .logo-img { max-height: 70px; margin: 0 auto 20px; display: block; object-fit: contain; }
    .clock-box { text-align: center; margin-bottom: 20px; padding: 15px; background: #f1f5f9; border-radius: 10px; }
    .clock-time { font-size: 28px; font-weight: 700; color: var(--main); }
    .clock-date { font-size: 14px; color: var(--text-light); margin-top: 5px; }
    video, canvas { width: 100%; border-radius: 10px; }
    hr { border: 0; height: 1px; background: var(--border); margin: 20px 0; }
    .lbl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-light); }
    @media print {
      body { background: #fff; margin: 0; padding: 0; }
      .app-container { max-width: 100%; box-shadow: none; border: none; padding: 0; }
      .card { box-shadow: none; border: none; padding: 0; margin: 0; }
      @page { size: A4; margin: 15mm; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div id="login-view" class="card" style="margin-top: 10vh;">
    <img id="logoLogin" src="https://upload.wikimedia.org/wikipedia/commons/9/97/Logo_PLN.png" class="logo-img" alt="Logo">
    <h2 style="text-align:center; margin-bottom:24px; color:var(--text);">Portal Absensi</h2>
    <input type="text" id="user" class="form-control" placeholder="Username / ID">
    <div style="position: relative;">
      <input type="password" id="pass" class="form-control" placeholder="Password">
      <i class="fa-solid fa-eye" id="eye" onclick="togglePass()" style="position: absolute; right: 15px; top: 14px; cursor: pointer; color:var(--text-light);"></i>
    </div>
    <button class="btn btn-main" onclick="doLogin(false)">Masuk</button>
  </div>

  <div id="first-view" class="card hidden" style="margin-top: 10vh;">
    <img id="logoFirst" src="" class="logo-img" alt="Logo">
    <h2 style="text-align:center; margin-bottom:20px;">Ubah Sandi Baru</h2>
    <input type="password" id="newPass" class="form-control" placeholder="Masukkan Sandi Baru">
    <button class="btn btn-green" onclick="doGantiPass()">Simpan Sandi</button>
  </div>

  <div id="staff-view" class="hidden">
    <div class="card" style="margin-top:20px;">
      <img id="logoStaff" src="" class="logo-img" alt="Logo">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <div>
          <h2 id="sNama" style="font-size:20px;"></h2>
          <p id="sArea" style="font-size:13px; color:var(--text-light);"></p>
        </div>
        <button onclick="doExit()" style="background:none; border:none; font-size:22px; color:var(--text-light); cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>

      <div class="clock-box">
        <div id="cTime" class="clock-time">00:00:00</div>
        <div id="cDate" class="clock-date">Memuat...</div>
        <div id="sJarak" style="font-size:12px; color:var(--main); margin-top:5px; font-weight:600;">Mencari lokasi area...</div>
      </div>
      
      <div id="boxHariLibur" class="hidden" style="background:#ef4444; color:#fff; padding:12px; border-radius:10px; text-align:center; margin-bottom:15px; font-weight:600;">
        HARI LIBUR
      </div>
      
      <div id="boxAbsen">
        <button class="btn btn-green" id="btnMasuk" onclick="tryMasuk()">Absen Masuk</button>
        <button class="btn btn-main" id="btnPulang" onclick="tryPulang()">Absen Pulang</button>
      </div>

      <button class="btn btn-out" id="btnIzin" onclick="document.getElementById('izinBox').classList.toggle('hidden')">Izin / Sakit</button>
      <div id="izinBox" class="hidden" style="margin-top:12px;">
        <input type="text" id="tglIzin" class="form-control" placeholder="Pilih Tanggal Izin">
        <textarea id="ketIzin" class="form-control" maxlength="255" placeholder="Keterangan" rows="3"></textarea>
        <button class="btn btn-orange" onclick="kirimIzin()">Simpan Izin</button>
      </div>
      
      <hr>
      <span class="lbl">Grafik Kehadiran</span>
      <canvas id="cUserBulan" style="margin-bottom:15px; max-height:200px;"></canvas>

      <hr>
      <span class="lbl">Cetak Laporan</span>
      <div style="display:flex; gap:10px;">
        <input type="month" id="blnCetak" class="form-control" style="margin-bottom:0;">
        <button class="btn btn-out" onclick="cetakAbsen()" style="margin-bottom:0; width:auto; padding:0 20px;"><i class="fa-solid fa-print"></i></button>
      </div>
    </div>
  </div>

  <div id="admin-view" class="hidden">
    <div class="card" style="margin-top:20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="font-size:20px;">Panel Admin</h2>
        <button onclick="doExit()" style="background:none; border:none; font-size:22px; color:var(--text-light); cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
      <span class="lbl">Pengaturan Umum</span>
      <select id="aLock" class="form-control"><option value="true">Lock Device ID: ON</option><option value="false">Lock Device ID: OFF</option></select>
      <input type="text" id="aLogo" class="form-control" placeholder="URL Gambar Logo">
      <textarea id="aHead" class="form-control" placeholder="HTML Header Cetak A4" rows="3"></textarea>
      <textarea id="aFoot" class="form-control" placeholder="HTML Footer Cetak A4" rows="3"></textarea>
      <button class="btn btn-green" onclick="saveSet()">Simpan Pengaturan</button>
      <hr>
      <span class="lbl">Kalender Libur</span>
      <div style="display:flex; gap:10px;">
        <input type="date" id="aLibur" class="form-control" style="margin-bottom:0;">
        <button class="btn btn-out" onclick="addLibur()" style="margin-bottom:0; width:auto; padding:0 20px;"><i class="fa-solid fa-plus"></i></button>
      </div>
      <hr>
      <span class="lbl">Manajemen Akun</span>
      <select id="rUser" class="form-control"></select>
      <button class="btn btn-red" onclick="resetAkun()">Reset Akun Terpilih</button>
      <hr>
      <span class="lbl">Tambah / Edit User</span>
      <select id="eList" class="form-control" onchange="loadFormEdit()"></select>
      <input type="text" id="eId" class="form-control" placeholder="ID Pegawai">
      <input type="text" id="eNama" class="form-control" placeholder="Nama Lengkap">
      <input type="text" id="ePass" class="form-control" placeholder="Sandi">
      <input type="text" id="eJab" class="form-control" placeholder="Jabatan">
      <select id="eArea" class="form-control">
        <option value="Kramat Jati">Kramat Jati</option>
        <option value="Lenteng Agung">Lenteng Agung</option>
        <option value="Ciracas">Ciracas</option>
        <option value="Pondok Gede">Pondok Gede</option>
        <option value="Bulungan">Bulungan</option>
      </select>
      <select id="eRole" class="form-control"><option value="staff">Staff</option><option value="admin">Admin</option></select>
      <div style="display:flex; gap:10px; margin-bottom:12px;">
        <input type="text" id="eAlamat" class="form-control" placeholder="Cari alamat" style="margin-bottom:0;">
        <button class="btn btn-out" onclick="cariAlamat()" style="margin-bottom:0; width:auto; padding:0 15px;"><i class="fa-solid fa-search"></i></button>
        <button class="btn btn-out" onclick="posisiKu()" style="margin-bottom:0; width:auto; padding:0 15px;"><i class="fa-solid fa-location-crosshairs"></i></button>
      </div>
      <div id="map" class="map-box"></div>
      <input type="text" id="eKoor" class="form-control" readonly placeholder="Klik peta untuk titik">
      <button class="btn btn-main" onclick="saveUser()">Simpan Data Pegawai</button>
    </div>
    <div class="card hidden" id="sa-box">
      <h3 style="color:#ef4444; margin-bottom:15px;">Bypass Superadmin</h3>
      <select id="saStaff" class="form-control"></select>
      <select id="saJenis" class="form-control"><option value="Masuk">Masuk</option><option value="Pulang">Pulang</option></select>
      <input type="datetime-local" id="saWaktu" class="form-control">
      <div id="saMap" class="map-box"></div>
      <input type="text" id="saKoor" class="form-control" readonly placeholder="Klik peta">
      <button class="btn btn-red" onclick="kirimBypass()">Suntik Data Absen</button>
    </div>
  </div>

  <div id="cam-view" class="card hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99; margin:0; border-radius:0; border:none;">
    <h3 style="text-align:center; margin-bottom:15px;" id="camTitle">Kamera Absen</h3>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" class="hidden"></canvas>
    <div style="margin-top:20px; display:flex; gap:10px;" id="boxCamUtama">
      <button class="btn btn-out" onclick="tutupKamera()">Batal</button>
      <button class="btn btn-main" onclick="ambilFoto()">Ambil Foto</button>
    </div>
    <div style="margin-top:20px; display:flex; gap:10px;" id="boxCamAksi" class="hidden">
      <button class="btn btn-out" onclick="ulangFoto()">Ambil Ulang</button>
      <button class="btn btn-green" onclick="kirimFoto()">Kirimkan</button>
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  const API_URL = "https://script.google.com/macros/s/AKfycbztoJ15wHaBBo5O7ImZWbF7SmlPH-czhxed6K8C9eKnQWVN8r08Y9xfItNFxrpZfNdn/exec";
  let uData = {}, jAbsen = "", ketTmp = "", stream = null, b64Tmp = "";
  let sMapInit = false, bMapInit = false, sMap = null, bMap = null, sMarker = null, bMarker = null;
  let allUsers = [], staffList = [];
  let clockInt;

  window.onload = () => {
    flatpickr("#tglIzin", { mode: "multiple", dateFormat: "Y-m-d" });
    let c = localStorage.getItem('hris_cred');
    if(c) {
      let cr = JSON.parse(c);
      document.getElementById('user').value = cr.u; document.getElementById('pass').value = cr.p;
      doLogin(true);
    }
  };

  function getDid() {
    let d = localStorage.getItem("hris_did");
    if (!d) { d = "dev_" + Math.random().toString(36).substring(2, 10); localStorage.setItem("hris_did", d); }
    return d;
  }
  function getUa() { let m = navigator.userAgent.match(/\((.*?)\)/); return m ? m[1] : "Unknown"; }
  function getJarak(lat1, lon1, lat2, lon2) {
    let p = Math.PI/180;
    let a = Math.sin((lat2-lat1)*p/2)**2 + Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin((lon2-lon1)*p/2)**2;
    return 6371e3 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function reqAPI(body, cb) {
    fetch(API_URL, { method: 'POST', redirect: 'follow', headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(body) })
    .then(r => r.json()).then(res => { Swal.close(); cb(res); }).catch(() => { Swal.fire('Error', 'Gagal memproses data.', 'error'); });
  }
  function show(id) { document.querySelectorAll('.app-container > div').forEach(e => e.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
  function togglePass() {
    let p = document.getElementById('pass'); let i = document.getElementById('eye');
    p.type = p.type === "password" ? "text" : "password"; i.className = p.type === "password" ? "fa-solid fa-eye" : "fa-solid fa-eye-slash";
  }
  function applyLogo(url) {
    if(!url) return;
    document.querySelectorAll('.logo-img').forEach(img => img.src = url);
  }
  function doExit() {
    localStorage.removeItem('hris_cred');
    window.close(); window.location.href="about:blank";
  }

  function doLogin(isAuto) {
    let u = document.getElementById('user').value, p = document.getElementById('pass').value;
    if(!isAuto) Swal.fire({title: 'Memeriksa Kredensial...', allowOutsideClick: false, didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "login", user: u, pass: p, deviceId: getDid()}, res => {
      if (res.status === "success") {
        localStorage.setItem('hris_cred', JSON.stringify({u:u, p:p}));
        uData = res; uData.u = u;
        if(res.setting && res.setting.logo) applyLogo(res.setting.logo);
        if (res.isFirst === true || res.isFirst === "TRUE") {
          show('first-view');
        } else if (res.role === "admin" || res.role === "superadmin") { 
          show('admin-view'); 
          document.getElementById('aLock').value = res.setting.lock.toString();
          document.getElementById('aLogo').value = res.setting.logo;
          document.getElementById('aHead').value = res.setting.header;
          document.getElementById('aFoot').value = res.setting.footer;
          loadAdminData();
          if(res.role === "superadmin") { document.getElementById('sa-box').classList.remove('hidden'); loadBypassMap(); }
        } else { 
          show('staff-view'); 
          document.getElementById('sNama').innerText = res.nama; document.getElementById('sArea').innerText = res.area;
          setupRules(); runClock(); loadUserDash();
          navigator.geolocation.getCurrentPosition(p => {
            let j = getJarak(uData.koordinat.lat, uData.koordinat.lng, p.coords.latitude, p.coords.longitude);
            document.getElementById('sJarak').innerText = "Jarak ke " + uData.area + ": " + Math.round(j) + " meter";
          });
        }
      } else if(!isAuto) Swal.fire('Gagal', res.msg, 'error');
    });
  }

  function runClock() {
    let dEl = document.getElementById('cDate'), tEl = document.getElementById('cTime');
    let days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    let mos = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    if(clockInt) clearInterval(clockInt);
    clockInt = setInterval(() => {
      let d = new Date();
      tEl.innerText = String(d.getHours()).padStart(2,'0') + ":" + String(d.getMinutes()).padStart(2,'0') + ":" + String(d.getSeconds()).padStart(2,'0');
      dEl.innerText = days[d.getDay()] + ", " + d.getDate() + " " + mos[d.getMonth()] + " " + d.getFullYear();
    }, 1000);
  }

  function setupRules() {
    let now = new Date(), day = now.getDay();
    let tglStr = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,'0') + "-" + String(now.getDate()).padStart(2,'0');
    let isLibur = day === 0 || day === 6 || uData.setting.libur.includes(tglStr);
    let bM = document.getElementById('btnMasuk'), bP = document.getElementById('btnPulang'), bI = document.getElementById('btnIzin');
    bM.innerText = "Absen Masuk"; bP.innerText = "Absen Pulang"; bM.className = "btn btn-green"; bP.className = "btn btn-main";
    bM.disabled = false; bP.disabled = false;
    
    if (isLibur) {
      document.getElementById('boxHariLibur').classList.remove('hidden');
      document.getElementById('boxAbsen').classList.add('hidden');
    } else {
      document.getElementById('boxHariLibur').classList.add('hidden');
      document.getElementById('boxAbsen').classList.remove('hidden');
      if(uData.ctx.masukToday) { bM.innerText = "Edit Absen Masuk"; bM.className = "btn btn-orange"; bP.disabled = false; }
      else { bP.disabled = true; }
      if(uData.ctx.pulangToday) { bP.innerText = "Edit Absen Pulang"; bP.className = "btn btn-orange"; }
    }
    if(uData.ctx.izinToday) { bI.innerText = "Edit Data Izin"; }
  }

  function loadUserDash() {
    let now = new Date();
    let bln = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,'0');
    reqAPI({aksi: "getBulanUser", user: uData.nama, bln: bln}, res => {
      let labels = [], masuk = [], pulang = [];
      let maxD = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      for(let i=1; i<=maxD; i++) {
        let dStr = bln + "-" + String(i).padStart(2,'0');
        let day = new Date(dStr).getDay();
        if(day !== 0 && day !== 6 && !uData.setting.libur.includes(dStr)) {
          labels.push(dStr);
          let m = res.data.find(x => x.tgl === dStr && x.jenis === "Masuk");
          let p = res.data.find(x => x.tgl === dStr && x.jenis === "Pulang");
          masuk.push(m ? parseFloat(m.wkt.replace('.', '.')) : null);
          pulang.push(p ? parseFloat(p.wkt.replace('.', '.')) : null);
        }
      }
      if(window.uChart) window.uChart.destroy();
      window.uChart = new Chart(document.getElementById('cUserBulan'), {
        type: 'bar',
        data: { labels: labels, datasets: [{label:'Masuk', data:masuk, backgroundColor:'#10b981'}, {label:'Pulang', data:pulang, backgroundColor:'#0ea5e9'}] },
        options: {
          onClick: (e, els) => {
            if(els.length > 0) {
              let idx = els[0].index, tgl = labels[idx], dIdx = els[0].datasetIndex;
              let jenis = dIdx === 0 ? "Masuk" : "Pulang";
              if(!els[0].element.$context.raw) injectPrompt(tgl, jenis);
            }
          }
        }
      });
    });
  }

  async function injectPrompt(tgl, jenis) {
    const {value: jam} = await Swal.fire({title: `Isi absen ${jenis}`, text: `Tanggal: ${tgl}`, input: 'time', inputValidator: v => !v && 'Pilih jam!'});
    if(jam) {
      Swal.fire({title: 'Menyimpan...', didOpen: () => {Swal.showLoading()}});
      reqAPI({aksi: "injectAbsen", data: {nama: uData.nama, tgl: tgl, jam: jam, jenis: jenis, area: uData.area}}, r => {
        if(r.status==="success") { Swal.fire('Berhasil','','success'); loadUserDash(); }
      });
    }
  }

  function tryMasuk() { ketTmp = ""; bukaKamera('Masuk'); }
  function tryPulang() { ketTmp = ""; bukaKamera('Pulang'); }

  function doGantiPass() {
    Swal.fire({title: 'Menyimpan...', didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "gantiPass", user: uData.u, passBaru: document.getElementById('newPass').value}, res => {
      if(res.status==="success") { 
        Swal.fire('Berhasil','Silakan login dengan sandi baru','success').then(() => {
          localStorage.removeItem('hris_cred');
          location.reload(); 
        }); 
      }
    });
  }

  function bukaKamera(j) {
    jAbsen = j; document.getElementById('camTitle').innerText = "Kamera " + j;
    document.getElementById('boxCamUtama').classList.remove('hidden'); document.getElementById('boxCamAksi').classList.add('hidden');
    document.getElementById('video').classList.remove('hidden'); document.getElementById('canvas').classList.add('hidden');
    show('cam-view'); 
    navigator.mediaDevices.getUserMedia({video: {facingMode: "user"}}).then(s => { stream = s; document.getElementById('video').srcObject = s; });
  }

  function tutupKamera() { show('staff-view'); if(stream) stream.getTracks().forEach(t => t.stop()); }

  function ambilFoto() {
    let v = document.getElementById('video'), c = document.getElementById('canvas'), x = c.getContext('2d');
    c.width = v.videoWidth; c.height = v.videoHeight; x.drawImage(v, 0, 0, c.width, c.height);
    b64Tmp = c.toDataURL("image/jpeg", 0.7);
    v.classList.add('hidden'); c.classList.remove('hidden');
    document.getElementById('boxCamUtama').classList.add('hidden'); document.getElementById('boxCamAksi').classList.remove('hidden');
  }

  function ulangFoto() {
    document.getElementById('video').classList.remove('hidden'); document.getElementById('canvas').classList.add('hidden');
    document.getElementById('boxCamUtama').classList.remove('hidden'); document.getElementById('boxCamAksi').classList.add('hidden');
  }

  function kirimFoto() {
    tutupKamera();
    Swal.fire({title: 'Melacak GPS & Mengirim...', allowOutsideClick: false, didOpen: () => {Swal.showLoading()}});
    navigator.geolocation.getCurrentPosition(p => {
      let lat = p.coords.latitude, lng = p.coords.longitude;
      let jar = getJarak(uData.koordinat.lat, uData.koordinat.lng, lat, lng);
      reqAPI({aksi: "absen", data: {nama: uData.nama, jenis: jAbsen, lokasi: lat+","+lng, jarak: Math.round(jar), foto: b64Tmp, area: uData.area, perangkat: getUa(), ket: ketTmp}}, res => {
        if(res.status==="success") {
          Swal.fire('Berhasil','Data tersimpan','success');
          if(jAbsen==="Masuk") uData.ctx.masukToday = true;
          if(jAbsen==="Pulang") uData.ctx.pulangToday = true;
          setupRules(); loadUserDash();
        }
      });
    }, err => { Swal.fire('GPS Gagal', 'Pastikan GPS aktif!', 'error'); }, {enableHighAccuracy: true, timeout: 15000});
  }

  function kirimIzin() {
    let t = document.getElementById('tglIzin').value;
    if(!t) return Swal.fire('Error','Pilih tanggal','error');
    Swal.fire({title: 'Menyimpan...', didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "izin", data: {nama: uData.nama, tglArr: t.split(', '), ket: document.getElementById('ketIzin').value, area: uData.area, perangkat: getUa()}}, res => {
      if(res.status==="success") {
        Swal.fire('Berhasil','Data izin tersimpan','success');
        uData.ctx.izinToday = true; setupRules(); loadUserDash();
      }
    });
  }

  function cetakAbsen() {
    let bln = document.getElementById('blnCetak').value;
    if(!bln) return Swal.fire('Error','Pilih bulan','error');
    Swal.fire({title: 'Memproses Laporan...', didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "cetak", user: uData.nama, bulan: bln}, res => {
      let lib = res.set.libur;
      let html = `<html><head><title>Cetak Laporan</title><style>@page{size:A4; margin:10mm;} body{font-family:sans-serif;} table{width:100%; border-collapse:collapse; margin-top:10px;} th,td{border:1px solid #000; padding:6px; text-align:center; font-size:12px;} .h{background:#ef4444; color:#fff; -webkit-print-color-adjust: exact;}</style></head><body>`;
      html += `<div>${res.set.header}</div><h3 style="text-align:center; margin:10px 0;">Laporan Kehadiran<br>${uData.nama} (${bln})</h3><table><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Keterangan</th></tr>`;
      let y = parseInt(bln.split('-')[0]), m = parseInt(bln.split('-')[1]);
      let maxD = new Date(y, m, 0).getDate();
      for(let i=1; i<=maxD; i++) {
        let tStr = y + "-" + String(m).padStart(2,'0') + "-" + String(i).padStart(2,'0');
        let d = new Date(tStr).getDay();
        let isL = d===0 || d===6 || lib.includes(tStr);
        let msk = res.data.find(x => x.tgl === tStr && x.jenis === "Masuk");
        let plg = res.data.find(x => x.tgl === tStr && x.jenis === "Pulang");
        let izn = res.data.find(x => x.tgl === tStr && x.jenis === "Izin");
        let mTxt = msk?msk.wkt:'-'; let pTxt = plg?plg.wkt:'-'; let kTxt = (msk?msk.ket+' ':'') + (plg?plg.ket:'');
        if(izn) { mTxt = "IZIN"; pTxt = "IZIN"; kTxt = izn.ket; }
        html += `<tr class="${isL?'h':''}"><td style="text-align:left;">${tStr}</td><td>${mTxt}</td><td>${pTxt}</td><td style="text-align:left;">${kTxt}</td></tr>`;
      }
      html += `</table><div style="margin-top:15px; page-break-inside:avoid;">${res.set.footer}</div></body></html>`;
      let w = window.open('','_blank'); w.document.write(html); w.document.close();
      setTimeout(()=> w.print(), 800);
    });
  }

  function saveSet() {
    Swal.fire({title: 'Menyimpan...', didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "saveSet", data: {lock: document.getElementById('aLock').value==="true", head: document.getElementById('aHead').value, foot: document.getElementById('aFoot').value, logo: document.getElementById('aLogo').value}}, res => {
      if(res.status==="success") { Swal.fire('Tersimpan','','success'); applyLogo(document.getElementById('aLogo').value); }
    });
  }
  
  function addLibur() { 
    if(!document.getElementById('aLibur').value) return;
    Swal.fire({title: 'Menyimpan...', didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "addLibur", tgl: document.getElementById('aLibur').value}, res => { if(res.status==="success") Swal.fire('Tersimpan','','success'); }); 
  }
  
  function resetAkun() {
    let id = document.getElementById('rUser').value;
    if(!id) return Swal.fire('Error','Pilih akun!','error');
    Swal.fire({title: 'Mereset...', didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "resetUser", id: id}, res => { if(res.status==="success") Swal.fire('Berhasil','Sandi dan HP direset','success'); });
  }

  function loadAdminData() {
    reqAPI({aksi: "listAllUsers"}, res => {
      if(res.status === "success") {
        allUsers = res.data; staffList = allUsers.filter(x => x.role === "staff");
        let optU = '<option value="">Pilih Akun...</option>';
        allUsers.forEach(s => { optU += `<option value="${s.id}">${s.id} - ${s.nama}</option>`; });
        document.getElementById('rUser').innerHTML = optU;
        let optE = '<option value="">+ Tambah Pegawai Baru</option>';
        allUsers.forEach(s => { optE += `<option value="${s.id}">Edit: ${s.nama}</option>`; });
        document.getElementById('eList').innerHTML = optE;
        let optS = '<option value="">Pilih Staf...</option>';
        staffList.forEach(s => { optS += `<option value="${s.nama}">${s.nama} (${s.area})</option>`; });
        document.getElementById('saStaff').innerHTML = optS;
        loadEditMap();
      }
    });
  }

  function loadFormEdit() {
    let id = document.getElementById('eList').value;
    if(!id) {
      document.getElementById('eId').value = ""; document.getElementById('eNama').value = ""; document.getElementById('ePass').value = "123456";
      document.getElementById('eJab').value = ""; document.getElementById('eArea').value = "Kramat Jati"; document.getElementById('eRole').value = "staff"; document.getElementById('eKoor').value = "";
      if(sMarker) sMap.removeLayer(sMarker); return;
    }
    let d = allUsers.find(x => x.id === id);
    if(d) {
      document.getElementById('eId').value = d.id; document.getElementById('eNama').value = d.nama; document.getElementById('ePass').value = d.pass;
      document.getElementById('eJab').value = d.jab; document.getElementById('eArea').value = d.area; document.getElementById('eRole').value = d.role; document.getElementById('eKoor').value = d.koor;
      if(d.koor) {
        let k = d.koor.split(',');
        if(sMarker) sMap.removeLayer(sMarker);
        sMarker = L.marker([parseFloat(k[0]), parseFloat(k[1])]).addTo(sMap);
        sMap.setView([parseFloat(k[0]), parseFloat(k[1])], 15);
      }
    }
  }

  function loadEditMap() {
    if(sMapInit) return; sMapInit = true; sMap = L.map('map').setView([-6.2, 106.8], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(sMap);
    sMap.on('click', e => {
      document.getElementById('eKoor').value = e.latlng.lat + "," + e.latlng.lng;
      if(sMarker) sMap.removeLayer(sMarker); sMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(sMap);
    });
  }

  function cariAlamat() {
    let a = document.getElementById('eAlamat').value;
    if(!a) return;
    fetch('https://nominatim.openstreetmap.org/search?format=json&q='+a).then(r=>r.json()).then(res=>{
      if(res.length>0){
        let lat = parseFloat(res[0].lat), lon = parseFloat(res[0].lon);
        sMap.setView([lat, lon], 15);
        if(sMarker) sMap.removeLayer(sMarker); sMarker = L.marker([lat, lon]).addTo(sMap);
        document.getElementById('eKoor').value = lat+","+lon;
      }
    });
  }

  function posisiKu() {
    navigator.geolocation.getCurrentPosition(p=>{
      let lat = p.coords.latitude, lon = p.coords.longitude;
      sMap.setView([lat, lon], 15);
      if(sMarker) sMap.removeLayer(sMarker); sMarker = L.marker([lat, lon]).addTo(sMap);
      document.getElementById('eKoor').value = lat+","+lon;
    });
  }

  function saveUser() {
    let d = { id: document.getElementById('eId').value, nama: document.getElementById('eNama').value, pass: document.getElementById('ePass').value, jab: document.getElementById('eJab').value, area: document.getElementById('eArea').value, role: document.getElementById('eRole').value, koor: document.getElementById('eKoor').value };
    if(!d.id || !d.nama) return Swal.fire('Error','ID dan Nama wajib','error');
    Swal.fire({title: 'Menyimpan...', didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "saveUser", data: d}, res => { if(res.status==="success") { Swal.fire('Tersimpan','','success'); loadAdminData(); } });
  }

  function loadBypassMap() {
    if(bMapInit) return; bMapInit = true; bMap = L.map('saMap').setView([-6.2, 106.8], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(bMap);
    bMap.on('click', e => {
      document.getElementById('saKoor').value = e.latlng.lat + "," + e.latlng.lng;
      if(bMarker) bMap.removeLayer(bMarker); bMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(bMap);
    }); setTimeout(() => bMap.invalidateSize(), 500);
  }

  function kirimBypass() {
    let sn = document.getElementById('saStaff').value, sj = document.getElementById('saJenis').value, sk = document.getElementById('saKoor').value, sw = document.getElementById('saWaktu').value;
    if(!sn || !sk) return Swal.fire('Error','Lengkapi data','error');
    let st = staffList.find(x => x.nama === sn), w = sw ? new Date(sw) : new Date();
    let cv = document.createElement('canvas'), cx = cv.getContext('2d'); cv.width = 600; cv.height = 400;
    cx.fillStyle = "#1f2937"; cx.fillRect(0,0,600,400); cx.fillStyle = "#fff"; cx.font = "bold 24px Inter"; cx.fillText("BYPASS SYSTEM", 30, 60); cx.font = "20px Inter"; cx.fillText("Waktu: " + w.toLocaleString('id-ID'), 30, 100);
    Swal.fire({title: 'Menyuntik...', didOpen: () => {Swal.showLoading()}});
    reqAPI({aksi: "absen", data: {nama: sn, jenis: sj, lokasi: sk, jarak: 0, foto: cv.toDataURL("image/jpeg", 0.8), area: st.area, waktu: w.toISOString(), perangkat: "Bypass System", ket: ""}}, res => {
      if(res.status==="success") { Swal.fire('Sukses','','success'); document.getElementById('saStaff').value = ""; }
    });
  }
</script>
</body>
</html>
