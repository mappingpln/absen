<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Absensi Mapping</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root { --primary: #2563eb; --primary-hover: #1d4ed8; --success: #10b981; --danger: #ef4444; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; --muted: #6b7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; }
    #app-container { width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg); position: relative; overflow-x: hidden; }
    .hidden { display: none !important; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { font-weight: 700; font-size: 24px; margin-bottom: 10px; color: var(--primary); }
    h3 { font-size: 16px; font-weight: 600; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    .form-control { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    .form-control:focus { border-color: var(--primary); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .header { background: var(--primary); color: white; padding: 20px 15px 40px 15px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-logout { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; }
    .profile-card { margin-top: -30px; position: relative; z-index: 10; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .info-box { background: #f9fafb; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #eee; font-size: 13px; }
    .info-box span { display: block; font-weight: 700; font-size: 14px; color: var(--primary); margin-top: 4px; }
    #areaKamera { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column; justify-content: center; padding: 15px; }
    video, canvas { width: 100%; border-radius: 12px; max-height: 70vh; object-fit: cover; background: #222; }
    .history-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; align-items: center; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: white; }
    .badge.Masuk { background: var(--success); }
    .badge.Pulang { background: var(--primary); }
    .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="app-container">
  <div id="loader" class="loader-overlay hidden">
    <div class="spinner"></div>
    <p style="font-weight: 600; color: var(--muted);" id="loader-text">Memproses...</p>
  </div>

  <div id="login-view">
    <div class="card" style="margin-top: 60px; text-align: center;">
      <i class="fa-solid fa-location-crosshairs" style="font-size: 50px; color: var(--primary); margin-bottom: 15px;"></i>
      <h2>Portal Absensi</h2>
      <p style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">Silakan masuk untuk absen</p>

      <div class="form-group">
        <label>ID / Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan ID">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password">
      </div>
      
      <button class="btn btn-primary" onclick="prosesLogin()"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
    </div>
  </div>

  <div id="dashboard-view" class="hidden">
    <div class="header">
      <div class="header-top">
        <div style="font-weight: 700; font-size: 18px;"><i class="fa-solid fa-clock"></i> AbsensiKu</div>
        <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
      </div>
      <div style="font-size: 14px; opacity: 0.9;" id="waktu-live">Memuat waktu...</div>
    </div>

    <div class="card profile-card">
      <h2 style="font-size: 18px;">Halo, <span id="lblNama"></span>! 👋</h2>
      <p style="font-size: 13px; color: var(--muted);"><i class="fa-solid fa-building"></i> <span id="lblArea"></span></p>
      <div class="info-grid">
        <div class="info-box">Jabatan<span id="lblJabatan"></span></div>
        <div class="info-box">Jarak ke Kantor<span id="lblJarakSekarang">Menghitung...</span></div>
      </div>
    </div>

    <div class="card">
      <h3><i class="fa-solid fa-camera-retro"></i> Rekam Kehadiran</h3>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-success" onclick="bukaKamera('Masuk')">Masuk</button>
        <button class="btn btn-primary" onclick="bukaKamera('Pulang')">Pulang</button>
      </div>
    </div>

    <div class="card">
      <h3><i class="fa-solid fa-list"></i> Riwayat Absensi</h3>
      <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <input type="date" id="tglMulai" class="form-control" style="padding: 8px;">
        <input type="date" id="tglSelesai" class="form-control" style="padding: 8px;">
        <button class="btn btn-primary" style="width: auto; margin: 0; padding: 8px 15px;" onclick="muatRiwayat()">Cari</button>
      </div>
      <div id="riwayatContainer" style="font-size: 13px; color: var(--muted); text-align: center;">Memuat data...</div>
    </div>
  </div>

  <div id="areaKamera" class="hidden">
    <h3 style="color:white; text-align:center; border:none;" id="judulKamera">Ambil Foto</h3>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" class="hidden"></canvas>
    
    <div style="margin-top: 20px;">
      <button class="btn btn-success" onclick="jepretDanKirim()" id="btnJepret"><i class="fa-solid fa-camera"></i> Jepret & Kirim</button>
      <button class="btn btn-danger" onclick="tutupKamera()"><i class="fa-solid fa-xmark"></i> Batal</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbztoJ15wHaBBo5O7ImZWbF7SmlPH-czhxed6K8C9eKnQWVN8r08Y9xfItNFxrpZfNdn/exec"; 

  let dataUser = {};
  let jenisAbsenAktif = "";
  let streamKamera = null;
  let intervalWaktu = null;

  function showLoader(txt) { document.getElementById('loader-text').innerText = txt; document.getElementById('loader').classList.remove('hidden'); }
  function hideLoader() { document.getElementById('loader').classList.add('hidden'); }

  function prosesLogin() {
    let u = document.getElementById('username').value;
    let p = document.getElementById('password').value;
    if(!u || !p) return Swal.fire("Peringatan", "Isi Username & Password!", "warning");

    showLoader("Memverifikasi...");
    
    fetch(API_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ aksi: "login", username: u, password: p })
    })
    .then(res => res.json())
    .then(res => {
      hideLoader();
      if(res.status === "success") {
        dataUser = res;
        masukDashboard();
      } else {
        Swal.fire("Gagal", res.pesan || "Data tidak ditemukan.", "error");
      }
    })
    .catch(err => { hideLoader(); Swal.fire("Error", "Gagal menghubungi server.", "error"); });
  }

  function masukDashboard() {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('dashboard-view').classList.remove('hidden');
    
    document.getElementById('lblNama').innerText = dataUser.nama;
    document.getElementById('lblJabatan').innerText = dataUser.jabatan;
    document.getElementById('lblArea').innerText = dataUser.area;

    let today = new Date();
    let lastWeek = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 7);
    document.getElementById('tglSelesai').value = today.toISOString().split('T')[0];
    document.getElementById('tglMulai').value = lastWeek.toISOString().split('T')[0];

    intervalWaktu = setInterval(() => {
      document.getElementById('waktu-live').innerText = new Date().toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'medium' });
    }, 1000);

    pantauJarak();
    muatRiwayat();
  }

  function logout() {
    document.getElementById('login-view').classList.remove('hidden');
    document.getElementById('dashboard-view').classList.add('hidden');
    document.getElementById('password').value = "";
    clearInterval(intervalWaktu);
  }

  function bukaKamera(jenis) {
    jenisAbsenAktif = jenis;
    document.getElementById('judulKamera').innerText = "Absen " + jenis;
    document.getElementById('areaKamera').classList.remove('hidden');
    document.getElementById('btnJepret').disabled = false;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => { streamKamera = stream; document.getElementById('video').srcObject = stream; })
      .catch(err => { tutupKamera(); Swal.fire("Error", "Gagal akses kamera.", "error"); });
  }

  function tutupKamera() {
    document.getElementById('areaKamera').classList.add('hidden');
    if (streamKamera) streamKamera.getTracks().forEach(track => track.stop());
  }

  function jepretDanKirim() {
    document.getElementById('btnJepret').disabled = true;
    showLoader("Mendapatkan Lokasi...");

    navigator.geolocation.getCurrentPosition(posisi => {
      let lat = posisi.coords.latitude;
      let lng = posisi.coords.longitude;
      let jarakM = hitungJarak(dataUser.koordinatKantor.lat, dataUser.koordinatKantor.lng, lat, lng);
      
      if (jarakM > 1000) {
        hideLoader(); tutupKamera();
        return Swal.fire("Gagal", `Anda di luar jangkauan! Jarak: ${Math.round(jarakM)}m (Max 1000m)`, "warning");
      }

      showLoader("Memproses Foto...");
      let video = document.getElementById('video');
      let canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      let ctx = canvas.getContext('2d');

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
      ctx.font = "16px Inter"; ctx.fillStyle = "#fff";
      ctx.fillText(`Nama: ${dataUser.nama} (${jenisAbsenAktif})`, 10, canvas.height - 55);
      ctx.fillText(`Lokasi: ${lat.toFixed(5)}, ${lng.toFixed(5)}`, 10, canvas.height - 35);
      ctx.fillText(`Waktu: ${new Date().toLocaleString('id-ID')}`, 10, canvas.height - 15);

      let fotoB64 = canvas.toDataURL("image/jpeg", 0.7);
      tutupKamera();

      let payloadData = { nama: dataUser.nama, jenisAbsen: jenisAbsenAktif, lokasiGPS: `${lat}, ${lng}`, jarak: Math.round(jarakM), fotoBase64: fotoB64 };
      kirimKeServer(payloadData);
    }, err => { hideLoader(); tutupKamera(); Swal.fire("Error GPS", "Aktifkan GPS Anda.", "error"); }, { enableHighAccuracy: true });
  }

  function kirimKeServer(payloadData) {
    fetch(API_URL, {
      method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ aksi: "absen", payload: payloadData })
    })
    .then(res => res.json())
    .then(res => {
      hideLoader();
      if(res.status === "success") { Swal.fire("Berhasil", res.pesan, "success"); muatRiwayat(); } 
      else { Swal.fire("Gagal", res.pesan, "error"); }
    }).catch(err => { hideLoader(); Swal.fire("Error", "Gagal mengirim data.", "error"); });
  }

  function muatRiwayat() {
    document.getElementById('riwayatContainer').innerHTML = "Memuat data...";
    fetch(API_URL, {
      method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ aksi: "riwayat", username: dataUser.nama })
    }).then(res => res.json()).then(res => {
      if(res.status === "success") {
        let tglM = new Date(document.getElementById('tglMulai').value).setHours(0,0,0,0);
        let tglS = new Date(document.getElementById('tglSelesai').value).setHours(23,59,59,999);
        
        let filtered = res.data.filter(i => { let w = new Date(i.waktu).getTime(); return w >= tglM && w <= tglS; });
        
        if(filtered.length === 0) { document.getElementById('riwayatContainer').innerHTML = "Tidak ada data."; return; }
        
        let html = "";
        filtered.forEach(item => {
          let tglStr = new Date(item.waktu).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
          html += `<div class="history-item">
            <div><div style="font-weight:600;">${tglStr}</div><div style="color:gray; font-size:11px;">Jarak: ${item.jarak}m | <a href="${item.foto}" target="_blank">Foto</a></div></div>
            <span class="badge ${item.jenis}">${item.jenis}</span>
          </div>`;
        });
        document.getElementById('riwayatContainer').innerHTML = html;
      }
    });
  }

  function hitungJarak(lat1, lon1, lat2, lon2) {
    const R = 6371e3; const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
    const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))); 
  }

  function pantauJarak() {
    if(navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        let j = hitungJarak(dataUser.koordinatKantor.lat, dataUser.koordinatKantor.lng, pos.coords.latitude, pos.coords.longitude);
        document.getElementById('lblJarakSekarang').innerText = Math.round(j) + "m";
        if(j > 1000) document.getElementById('lblJarakSekarang').style.color = "red";
      });
    }
  }
</script>
</body>
</html>
